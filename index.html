<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Today's news, read by an older light. A daily reading that sets the world's news beside Scripture.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#141611" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#EDEAE1" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lamplight">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 34 44'%3E%3Cpath d='M17 20c0 5 4 6 4 10a4 4 0 0 1-8 0c0-4 4-5 4-10Z' fill='%23D9A63C'/%3E%3C/svg%3E">
<style>html{color-scheme:light dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Lamplight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#EDEAE1; --surface:#F7F5EF; --surface-2:#E4E0D4;
  --ink:#1B1E18; --ink-mid:#4A4F45; --ink-soft:#6E7367;
  --rule:#D3CEC0; --rule-firm:#B9B3A2;
  --brass:#8A6614; --brass-lit:#B98D22;
  --gilt-a:#7A5A12; --gilt-b:#D9B45A; --gilt-c:#A87C1C;
  --lament:#7A4C5B; --good:#3F6B4A;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#141611; --surface:#1C1F18; --surface-2:#252921;
  --ink:#E9E5D9; --ink-mid:#B3B0A2; --ink-soft:#8A8878;
  --rule:#2E332A; --rule-firm:#3F453A;
  --brass:#D9A63C; --brass-lit:#EFC468;
  --gilt-a:#7A5A12; --gilt-b:#EFCF7E; --gilt-c:#C79A34;
  --lament:#C4909F; --good:#86B393;
}}
:root[data-theme="dark"]{
  --ground:#141611; --surface:#1C1F18; --surface-2:#252921;
  --ink:#E9E5D9; --ink-mid:#B3B0A2; --ink-soft:#8A8878;
  --rule:#2E332A; --rule-firm:#3F453A;
  --brass:#D9A63C; --brass-lit:#EFC468;
  --gilt-a:#7A5A12; --gilt-b:#EFCF7E; --gilt-c:#C79A34;
  --lament:#C4909F; --good:#86B393;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);
  font-family:"Archivo","Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.6;
  -webkit-font-smoothing:antialiased;padding-block:0;margin:0}
.app{max-width:620px;margin:0 auto;padding-inline:20px;padding-bottom:96px;display:block}
.app:focus{outline:none}
.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;left:-9999px;top:8px;z-index:100;background:var(--surface);
  color:var(--ink);border:1px solid var(--brass);border-radius:6px;padding:10px 16px;
  font-size:14px;text-decoration:none}
.skip:focus{left:12px}
h1,h2,h3,h4{margin:0;text-wrap:balance}
p{margin:0}
a{color:inherit}
.scripture,.g{font-family:"EB Garamond","Iowan Old Style",Georgia,serif}
.mono,.ref{font-family:"IBM Plex Mono",ui-monospace,monospace}
.ref{font-size:11.5px;letter-spacing:.02em;color:var(--brass)}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-soft)}

/* header */
header{padding-block:26px 18px;border-bottom:1px solid var(--rule);margin-bottom:22px}
.brandline{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:8px}
.brand .nm{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.22em;
  text-transform:uppercase}
.brand .sub{font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--brass);display:block;margin-top:3px}
.today-date{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-soft)}
.register-line{font-family:"EB Garamond",Georgia,serif;font-size:22px;line-height:1.34;
  margin-top:18px;font-weight:500}
.provenance{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.pv{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.06em;
  text-transform:uppercase;border:1px solid var(--rule-firm);border-radius:3px;
  padding:3px 7px;color:var(--ink-soft)}

/* themes */
.themes{display:flex;flex-direction:column;gap:14px}
.theme{background:var(--surface);border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.theme-btn{width:100%;background:none;border:0;text-align:left;cursor:pointer;color:inherit;
  font:inherit;padding:16px;display:flex;flex-direction:column;gap:9px}
.theme-btn:focus-visible{outline:2px solid var(--brass);outline-offset:-2px}
.theme-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.chip{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.13em;
  text-transform:uppercase;padding:3px 7px;border-radius:3px;border:1px solid currentColor;
  color:var(--brass);flex:none}
.chip.grief,.chip.lament,.chip.injustice,.chip.betrayal{color:var(--lament)}
.chip.mercy,.chip.reconciliation,.chip.provision,.chip.joy{color:var(--good)}
.theme-name{font-family:"EB Garamond",Georgia,serif;font-size:25px;line-height:1.15;font-weight:500}
.theme-desc{font-size:13.5px;color:var(--ink-mid);line-height:1.5}
.caret{transition:transform .22s ease;color:var(--ink-soft);flex:none}
.theme[data-open="true"] .caret{transform:rotate(180deg)}
.theme-body{padding:0 16px 16px;display:flex;flex-direction:column;gap:16px}

.stories{border-top:1px solid var(--rule);padding-top:12px;display:flex;flex-direction:column}
.stories .eyebrow{margin-bottom:6px}
.story{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:9px 0;
  border-bottom:1px dotted var(--rule);text-decoration:none;align-items:center}
.story:last-child{border-bottom:0}
.story:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:4px}
.story .hl{font-size:13.5px;line-height:1.4;color:var(--ink)}
.story .meta{grid-column:1/2;display:flex;align-items:center;gap:7px}
.story .src{font-family:"IBM Plex Mono",monospace;font-size:9.5px;color:var(--brass);
  letter-spacing:.04em;text-transform:uppercase}
.story .go{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-soft);display:inline-flex;align-items:center;gap:4px;
  border-bottom:1px solid var(--rule-firm);padding-bottom:1px}
.story:hover .go,.story:focus-visible .go{color:var(--brass);border-bottom-color:var(--brass)}
.story:hover .hl{text-decoration:underline;text-underline-offset:2px;
  text-decoration-color:var(--rule-firm)}

/* passage */
.passage{position:relative;padding-left:15px}
.passage::before{content:"";position:absolute;left:0;top:2px;bottom:2px;width:3px;border-radius:2px;
  background:linear-gradient(180deg,var(--gilt-a),var(--gilt-b) 32%,var(--gilt-c) 58%,var(--gilt-a))}
.plabel{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-soft);margin-bottom:7px;display:flex;align-items:center;gap:7px}
.plabel .dot{width:3px;height:3px;border-radius:50%;background:var(--brass)}
.passage h3,.passage h4{font-family:"EB Garamond",Georgia,serif;font-size:18px;font-weight:600;margin-bottom:3px}
.passage .ref{display:block;margin-bottom:9px}
.ptext{font-family:"EB Garamond",Georgia,serif;font-size:18.5px;line-height:1.5;
  max-height:11.2em;overflow:hidden;position:relative;transition:max-height .3s ease}
.ptext.open{max-height:none}
.ptext:not(.open)::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3.6em;
  background:linear-gradient(180deg,transparent,var(--surface));pointer-events:none}

/* Pointer devices get a real scroll region with a gilt slider, so a long passage is
   readable in place instead of fading out mid-sentence.
   Deliberately NOT applied to touch. A nested scroller on a phone traps the swipe:
   the reader tries to scroll the page, the passage moves instead, and the page feels
   broken. Touch keeps the clamp-and-expand behaviour, which is the native idiom. */
@media (hover:hover) and (pointer:fine){
  .ptext{max-height:15.5em;overflow-y:auto;overscroll-behavior:contain;padding-right:16px;
    scrollbar-width:thin;scrollbar-color:var(--rule-firm) transparent}
  .ptext::after{display:none}
  .ptext::-webkit-scrollbar{width:7px}
  .ptext::-webkit-scrollbar-track{background:transparent}
  .ptext::-webkit-scrollbar-thumb{background:var(--rule-firm);border-radius:4px}
  /* the slider lights up when the passage has the reader's attention */
  .ptext:hover,.ptext:focus-within{scrollbar-color:var(--gilt-c) transparent}
  .ptext:hover::-webkit-scrollbar-thumb,.ptext:focus-within::-webkit-scrollbar-thumb{
    background:linear-gradient(180deg,var(--gilt-a),var(--gilt-b) 40%,var(--gilt-c))}
  .ptext:focus-visible{outline:2px solid var(--brass);outline-offset:4px;border-radius:3px}
  .ptext.open{max-height:none;overflow:visible;padding-right:0}
}
.ctx{margin-top:10px;padding:9px 11px;background:var(--surface-2);border-radius:6px;
  font-size:12.5px;line-height:1.5;color:var(--ink-mid)}
.ctx b{color:var(--ink)}
.conn{margin-top:9px;font-size:13.5px;line-height:1.55;color:var(--ink-mid);font-style:italic}
.acts{display:flex;gap:6px;margin-top:11px;flex-wrap:wrap}
.act{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
  padding:5px 9px;border:1px solid var(--rule-firm);border-radius:4px;background:none;
  color:var(--ink-mid);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:5px}
.act:hover{border-color:var(--brass);color:var(--brass)}
.act:focus-visible{outline:2px solid var(--brass);outline-offset:1px}
.gen-note{font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--lament);border:1px solid var(--lament);
  border-radius:3px;padding:2px 6px;margin-left:6px}

/* checks */
.checks{margin-top:10px;padding-top:10px;border-top:1px solid var(--rule);display:none;flex-wrap:wrap;gap:5px}
.checks.open{display:flex}
.chk{font-family:"IBM Plex Mono",monospace;font-size:9.5px;padding:3px 7px;border-radius:3px;
  border:1px solid var(--rule-firm);color:var(--ink-soft)}
.chk.pass{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,transparent)}
.chk.fail{color:var(--lament);border-color:var(--lament)}
.blocked{margin-top:9px;padding:9px 11px;border-radius:6px;border:1px dashed var(--lament);
  font-size:12px;color:var(--ink-mid);line-height:1.5}
.blocked b{color:var(--lament)}

/* word */
.word{margin-top:22px;padding:26px 20px;border-radius:12px;text-align:center;
  background:var(--surface);border:1px solid var(--rule);position:relative;overflow:hidden}
.word::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 78% at 50% -18%,color-mix(in srgb,var(--brass) 15%,transparent),transparent 62%)}
.word .wt{font-family:"EB Garamond",Georgia,serif;font-size:22px;line-height:1.42;position:relative;z-index:1}
.word .ref{display:block;margin-top:12px}
.word .why{margin-top:14px;padding-top:13px;border-top:1px solid var(--rule);font-size:12.5px;
  color:var(--ink-mid);line-height:1.5;text-align:left;position:relative;z-index:1}

/* tabs + panes */
/* Flex, not a fixed column count. A grid of repeat(4,1fr) wrapped the fifth tab onto
   a second row the moment Pray was added; flex adapts to however many tabs exist. */
.tabbar{position:fixed;bottom:0;left:0;right:0;border-top:1px solid var(--rule);
  background:var(--ground);z-index:20;
  padding:9px max(8px, env(safe-area-inset-left)) calc(10px + env(safe-area-inset-bottom))}
.tabbar-inner{display:flex;max-width:620px;margin:0 auto;width:100%}
.tab{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;
  color:var(--ink-soft);font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.08em;
  text-transform:uppercase;background:none;border:0;cursor:pointer;padding:4px 2px;border-radius:6px}
.tab:hover{color:var(--ink-mid)}
.tab:focus-visible{outline:2px solid var(--brass);outline-offset:-2px}
.tab span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tab[aria-selected="true"]{color:var(--brass)}
.pane{padding-top:4px}
.pane[hidden]{display:none}
.setting{background:var(--surface);border:1px solid var(--rule);border-radius:10px;
  overflow:hidden;margin-bottom:16px}
.setting h3{padding:13px 16px;border-bottom:1px solid var(--rule);font-size:14px;font-weight:600}
.opt{display:grid;grid-template-columns:18px 1fr auto;gap:12px;align-items:start;padding:13px 16px;
  border-bottom:1px solid var(--rule);cursor:pointer;background:none;border-left:0;border-right:0;
  border-top:0;width:100%;text-align:left;color:inherit;font:inherit}
.opt:last-child{border-bottom:0}
.opt[aria-checked="true"]{background:color-mix(in srgb,var(--brass) 8%,transparent)}
.radio{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--rule-firm);margin-top:3px}
.opt[aria-checked="true"] .radio{border-color:var(--brass);box-shadow:inset 0 0 0 3.5px var(--brass)}
.opt .nm{font-size:14px;font-weight:600;margin-bottom:2px}
.opt .dt{font-size:12px;color:var(--ink-mid);line-height:1.45}
.opt .ct{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--ink-soft);white-space:nowrap}
.note{padding:12px 16px;background:var(--surface-2);font-size:12px;color:var(--ink-mid);line-height:1.55}
.day-card{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--rule);
  border-radius:10px;padding:16px;margin-bottom:12px;color:inherit;font:inherit;cursor:pointer}
.day-card .d{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--brass);margin-bottom:6px}
.day-card .r{font-family:"EB Garamond",Georgia,serif;font-size:17px;line-height:1.35}
.empty{padding:34px 18px;text-align:center;color:var(--ink-soft);font-size:14px;line-height:1.6}
.banner{background:color-mix(in srgb,var(--lament) 12%,var(--surface));border:1px solid var(--lament);
  border-radius:9px;padding:12px 15px;margin-bottom:18px;font-size:12.5px;line-height:1.55;color:var(--ink-mid)}
.banner b{color:var(--ink)}
.rev-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.rbtn{font-size:12.5px;font-weight:500;padding:7px 14px;border-radius:5px;
  border:1px solid var(--rule-firm);background:none;color:var(--ink-mid);cursor:pointer;font-family:inherit}
.rbtn.primary{background:var(--brass);border-color:var(--brass);color:var(--ground);font-weight:600}
.rbtn[disabled]{opacity:.5;cursor:default}

/* theme control */
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:12px 16px}
.seg button{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;padding:9px 4px;border:1px solid var(--rule-firm);border-radius:5px;
  background:none;color:var(--ink-mid);cursor:pointer;display:flex;align-items:center;
  justify-content:center;gap:5px}
.seg button[aria-pressed="true"]{border-color:var(--brass);color:var(--brass);
  background:color-mix(in srgb,var(--brass) 10%,transparent);font-weight:500}
.seg button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

/* about */
.about-hero{padding:26px 20px 22px;border-bottom:1px solid var(--rule);margin-bottom:4px}
.about-hero .lede{font-family:"EB Garamond",Georgia,serif;font-size:24px;line-height:1.34;
  margin-top:12px}
.about-hero .lede em{color:var(--brass);font-style:italic}
.about-sec{padding:20px 0;border-bottom:1px solid var(--rule)}
.about-sec:last-child{border-bottom:0}
.about-sec h3{font-family:"EB Garamond",Georgia,serif;font-size:21px;font-weight:500;
  margin-bottom:9px;line-height:1.2}
.about-sec p{font-size:14.5px;line-height:1.65;color:var(--ink-mid);margin-bottom:11px}
.about-sec p:last-child{margin-bottom:0}
.about-sec p strong,.about-sec p b{color:var(--ink);font-weight:600}
.promises{display:flex;flex-direction:column;gap:0;margin-top:6px}
.promise{display:grid;grid-template-columns:22px 1fr;gap:12px;padding:11px 0;
  border-bottom:1px solid var(--rule)}
.promise:last-child{border-bottom:0}
.promise .n{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--brass);padding-top:3px}
.promise .t{font-size:14px;font-weight:600;margin-bottom:3px}
.promise .d{font-size:13px;color:var(--ink-mid);line-height:1.55}
.limits{border:1px solid var(--lament);border-radius:9px;padding:16px 18px;margin-top:6px;
  background:color-mix(in srgb,var(--lament) 7%,transparent)}
.limits h4{font-size:14px;font-weight:600;margin-bottom:9px;color:var(--ink)}
.limits li{font-size:13.5px;line-height:1.6;color:var(--ink-mid);margin-bottom:7px}
.limits ul{margin:0;padding-left:18px}
.credits{font-size:12.5px;line-height:1.7;color:var(--ink-mid)}
.credits a{color:var(--brass)}

/* pray + meditate */
.pray-card{border:1px solid var(--rule);border-radius:11px;background:var(--surface);
  padding:24px 20px;margin-bottom:16px;position:relative;overflow:hidden}
.pray-card::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(130% 70% at 50% -20%,color-mix(in srgb,var(--brass) 13%,transparent),transparent 62%)}
.pray-card > *{position:relative;z-index:1}
.pray-text{font-family:"EB Garamond",Georgia,serif;font-size:19.5px;line-height:1.55;
  margin-top:14px;max-height:22em;overflow-y:auto;overscroll-behavior:contain;
  scrollbar-width:thin;scrollbar-color:var(--rule-firm) transparent;padding-right:10px}
.pray-why{margin-top:16px;padding-top:14px;border-top:1px solid var(--rule);
  font-size:12.5px;color:var(--ink-mid);line-height:1.55}
.big{display:block;width:100%;text-align:center;font-family:"IBM Plex Mono",monospace;
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:14px;border-radius:8px;
  border:1px solid var(--brass);background:none;color:var(--brass);cursor:pointer;font-weight:500}
.big:hover{background:color-mix(in srgb,var(--brass) 12%,transparent)}
.big:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.big.solid{background:var(--brass);color:var(--ground);font-weight:600}
.ladder{display:flex;flex-direction:column;margin-top:6px}
.rung{display:grid;grid-template-columns:26px 1fr auto;gap:13px;padding:13px 0;
  border-bottom:1px solid var(--rule);align-items:baseline}
.rung:last-child{border-bottom:0}
.rung .n{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--brass)}
.rung .nm{font-family:"EB Garamond",Georgia,serif;font-size:18px}
.rung .en{font-size:12px;color:var(--ink-soft);margin-left:7px}
.rung .d{font-size:13px;color:var(--ink-mid);line-height:1.5;grid-column:2/4;margin-top:3px}
.rung .t{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-soft)}

/* meditation player */
.player{position:fixed;inset:0;z-index:60;background:var(--ground);display:flex;
  flex-direction:column;padding:20px;overflow-y:auto}
.player[hidden]{display:none}
.player-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex:none}
.player-close{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;background:none;border:1px solid var(--rule-firm);border-radius:5px;
  padding:7px 12px;color:var(--ink-mid);cursor:pointer}
.player-body{flex:1;display:flex;flex-direction:column;justify-content:center;
  max-width:600px;margin:0 auto;width:100%;padding-block:24px}
.mv-name{font-family:"EB Garamond",Georgia,serif;font-size:40px;line-height:1;margin-bottom:4px}
.mv-en{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--brass)}
.mv-inst{font-size:15.5px;line-height:1.65;color:var(--ink-mid);margin-top:18px}
.mv-passage{font-family:"EB Garamond",Georgia,serif;font-size:20px;line-height:1.6;
  margin-top:22px;padding-left:16px;position:relative;max-height:40vh;overflow-y:auto;
  scrollbar-width:thin;scrollbar-color:var(--rule-firm) transparent}

const T = DATA.today;

const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtDate = iso => {
  const [y,m,d] = iso.split("-").map(Number);
  const dt = new Date(Date.UTC(y, m-1, d));
  return dt.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",year:"numeric",timeZone:"UTC"}).toUpperCase();
};

/* ---------- passage block ---------- */
function passage(p, label){
  if(!p || p.abstained){
    return `<div class="passage"><div class="plabel"><span class="dot"></span>${esc(label)}</div>
      <div class="blocked"><b>No passage cleared the Reading Rule.</b> ${p&&p.rejected_before_this?p.rejected_before_this.length:0}
      candidate(s) were considered and blocked. Silence is a valid outcome — a bad match on someone's worst day is not recoverable.</div></div>`;
  }
  const audio = p.audio && (p.audio.gilbert || p.audio.hays || p.audio.david || Object.values(p.audio)[0]);
  const gen = p.heading_source === "lamplight" ? `<span class="gen-note">Title ours</span>` : "";
  const checks = (p.checks||[]).map(c =>
    `<span class="chk ${c.passed?"pass":"fail"}" title="${esc(c.detail)}">${c.passed?"✓":"✕"} ${esc(c.rule)} · ${esc(c.name)}</span>`).join("");
  const blocked = (p.rejected_before_this||[]).length
    ? `<div class="blocked"><b>${p.rejected_before_this.length} blocked before this:</b> ` +
      p.rejected_before_this.map(r=>`${esc(r.reference)} — ${esc((r.blocked_by||[]).join("; "))}`).join(" · ") + `</div>`
    : "";
  const isEcho = /Echo/.test(label);
  return `<div class="passage${isEcho ? " echo-slot" : ""}">
    <div class="plabel"><span class="dot"></span>${esc(label)}</div>
    <h3 class="scripture">${esc(p.heading||"")}${gen}</h3>
    <span class="ref">${esc(p.reference.toUpperCase())} · ${esc(T.translation)} · ${p.word_count} WORDS</span>
    <div class="ptext" data-text tabindex="0" role="region" aria-label="Passage text, scrollable">${esc(p.text)}</div>
    <div class="ctx"><b>What is happening here:</b> ${esc(p.context)}</div>
    <div class="conn">${esc(p.connection)}</div>
    <div class="acts">
      <button type="button" class="act" data-expand>Read in full</button>
      ${audio?`<a class="act" href="${esc(audio)}" target="_blank" rel="noopener">Listen ▸</a>`:""}
      <button type="button" class="act" data-checks>Why this passage</button>
      <button type="button" class="act" data-note="${esc(p.reference)}">Note</button>
      <button type="button" class="act" data-share="${esc(p.reference)}">Share</button>
    </div>
    <div class="notewrap" hidden>
      <textarea class="notebox" id="note-${esc(p.reference).replace(/[^a-zA-Z0-9]/g,"-")}"
        placeholder="Anything you want to keep about this passage. Stays on this device."></textarea>
      <div class="saved-note" hidden>Saved on this device</div>
    </div>
    <div style="margin-top:8px"><button type="button" class="wrong" data-wrong="${esc(p.reference)}" aria-pressed="false">This reading was wrong</button></div>
    <div class="checks">${checks}${blocked?"":""}</div>
    ${blocked}
  </div>`;
}

/* ---------- today ---------- */
/* Freshness. The app serves the newest day it has, so a broken pipeline would
   otherwise show a three-day-old reading, correctly dated, looking entirely normal.
   That is the failure mode that has cost this estate the most, so it is stated. */
const todayISO = new Date().toLocaleDateString("en-CA");
const ageDays = Math.round(
  (Date.parse(todayISO + "T00:00:00Z") - Date.parse(T.date + "T00:00:00Z")) / 86400000);
const staleBanner = ageDays >= 1
  ? `<div class="stale"><b>This reading is ${ageDays} day${ageDays === 1 ? "" : "s"} old.</b>
      It is the most recent one that exists — today's has not been made. The news below
      is from ${fmtDate(T.date)}, not from today.</div>`
  : "";

function passageFor(ref){
  for (const t of T.themes){
    for (const k of ["echo","promise"]){
      const m = t[k];
      if (m && !m.abstained && m.reference === ref) return m;
    }
  }
  if (T.word_for_today && T.word_for_today.reference === ref) return T.word_for_today;
  if (T.prayer && T.prayer.reference === ref) return T.prayer;
  return null;
}
function wrapLines(ctx, text, maxWidth){
  const words = text.split(/\s+/); const lines = []; let line = "";
  for (const w of words){
    const test = line ? line + " " + w : w;
    if (ctx.measureText(test).width > maxWidth && line){ lines.push(line); line = w; }
    else line = test;
  }
  if (line) lines.push(line);
  return lines;
}
function drawShare(match){
  const c = document.getElementById("sheet-canvas");
  const g = c.getContext("2d");
  const css = getComputedStyle(document.documentElement);
  const ground = css.getPropertyValue("--surface").trim() || "#F7F5EF";
  const ink = css.getPropertyValue("--ink").trim() || "#1B1E18";
  const soft = css.getPropertyValue("--ink-soft").trim() || "#6E7367";
  const brass = css.getPropertyValue("--brass").trim() || "#8A6614";
  g.fillStyle = ground; g.fillRect(0,0,c.width,c.height);
  const grad = g.createLinearGradient(72,0,76,c.height);
  grad.addColorStop(0,"#7A5A12"); grad.addColorStop(.35,"#D9B45A"); grad.addColorStop(1,"#7A5A12");
  g.fillStyle = grad; g.fillRect(72,110,6,c.height-260);

  g.fillStyle = soft; g.font = "500 24px 'IBM Plex Mono', monospace";
  g.fillText("LAMPLIGHT · THE SECOND READING", 110, 92);

  g.fillStyle = ink; g.font = "600 46px 'EB Garamond', Georgia, serif";
  wrapLines(g, match.heading || "", c.width-220).slice(0,2)
    .forEach((l,i) => g.fillText(l, 110, 190 + i*54));

  g.fillStyle = brass; g.font = "500 24px 'IBM Plex Mono', monospace";
  g.fillText((match.reference||"").toUpperCase() + " · " + T.translation, 110, 300);

  g.fillStyle = ink; g.font = "400 40px 'EB Garamond', Georgia, serif";
  const body = (match.text||"").length > 420 ? match.text.slice(0,420).replace(/\s+\S*$/,"") + "…" : match.text;
  wrapLines(g, body, c.width-230).slice(0,12).forEach((l,i) => g.fillText(l, 110, 372 + i*52));

  g.fillStyle = soft; g.font = "400 21px 'Archivo', sans-serif";
  g.fillText("Berean Standard Bible · public domain", 110, c.height-60);
  return c;
}
function openShare(ref){

}

const REMIND_KEY = "lamplight.remind";
function readRemind(){
  try { return JSON.parse(localStorage.getItem(REMIND_KEY) || "null"); } catch { return null; }

function scheduleReminder(){
  const pref = readRemind();
  if (!pref || !pref.on) return;
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  const [h, m] = (pref.time || "07:00").split(":").map(Number);
  const now = new Date();
  const next = new Date(now);
  next.setHours(h, m, 0, 0);
  if (next <= now) next.setDate(next.getDate() + 1);
  const delay = next - now;
  // setTimeout only survives while the page lives. That is the honest limit, and the
  // Settings copy says so rather than implying a push service we do not run.
  if (delay < 86400000){
    clearTimeout(window.__lampTimer);
    window.__lampTimer = setTimeout(() => {
      navigator.serviceWorker?.ready?.then(reg =>
        reg.active?.postMessage({type: "notify", body: "Today's reading is ready."}));
      scheduleReminder();
    }, delay);
  }
}

function findHome(){
  const grid = GROUPS.map(([name, slugs]) => {

    return cards ? `<div class="groupname">${esc(name)}</div><div class="grid">${cards}</div>` : "";
  }).join("");
  return `
    <form class="findbar" role="search" onsubmit="return false">
      <input type="search" id="q" placeholder="Or describe it in your own words&hellip;"
             aria-label="Describe what you are going through">
      <button type="button" data-dosearch>Search</button>
    </form>
    <div id="findout"></div>
    <p class="finding">${STANDING.length} readings below, each one matched by the same
      pipeline the daily reading uses &mdash; real retrieval, the Reading Rule, and a prayer.
      Searching in your own words is a <b>weaker</b> mechanism: it matches wording rather than
      meaning, and it finds passages rather than building a reading. The difference is real and
      worth knowing before you trust a result.</p>
    ${grid}`;
}
document.getElementById("pane-find").innerHTML = findHome();

/* lazy: the search index is 1.2 MB and most readers never open it */
let SEARCH = null, searchLoading = false;
async function loadSearch(){
  if (SEARCH || searchLoading) return SEARCH;
  searchLoading = true;
  try {
    const r = await fetch("search.json");
    SEARCH = await r.json();
  } catch { SEARCH = null; }
  searchLoading = false;
  return SEARCH;
}
const STOPW = new Set("a an and are as at be but by for from had has have he her his i in is it its me my not of on or our she that the their them they this to was we were what when which who will with you your".split(" "));
function qtok(t){ return (t.toLowerCase().match(/[a-z]{3,}/g) || []).filter(w => !STOPW.has(w)); }

function runSearch(query){
  const out = document.getElementById("findout");
  const terms = qtok(query);
  if (!terms.length){ out.innerHTML = ""; return; }
  if (!SEARCH){ out.innerHTML = `<p class="finding">Could not load the search index.</p>`; return; }
  const syn = SEARCH.syn || {}, idf = SEARCH.idf || {};
  const weights = new Map();
  for (const t of terms){
    weights.set(t, 1);
    for (const nb of (syn[t] || []).slice(0,4))
      if (!weights.has(nb)) weights.set(nb, 0.55);
  }
  const scored = [];
  for (const it of SEARCH.items){
    if (!it.e) continue;                 // Rule I, precomputed
    const hay = new Set(qtok(it.s));
    let score = 0, covered = 0;
    for (const t of terms){
      if (hay.has(t)){ covered++; }
      else if ((syn[t] || []).slice(0,4).some(n => hay.has(n))) covered += 0.6;
    }
    for (const [w, v] of weights) if (hay.has(w)) score += (idf[w] || 1.6) * v;
    if (score > 0) scored.push([score * (0.4 + 0.6 * covered / terms.length), it]);
  }
  scored.sort((a,b) => b[0]-a[0]);
  const top = scored.slice(0, 12);
  out.innerHTML = top.length ? `
    <div class="groupname">${top.length} passages matched by wording</div>
    ${top.map(([, it]) => `
      <button type="button" class="hit" data-passage="${esc(it.i)}">
        <span class="rf">${esc(it.r.toUpperCase())}${it.p ? " · CAN BE PRAYED" : ""}</span>
        <div class="hh">${esc(it.h)}</div>
        <div class="ss">${esc(it.s)}</div>
      </button>`).join("")}
    <p class="finding">These were found by matching your words against a plain-language
      description of each passage. No reading has been built around them and the Rule's
      commentary checks have not run &mdash; only the exclusion of judgment and apocalyptic
      material, which is precomputed. Read them as a starting point, not as today's reading.</p>`
    : `<p class="finding">Nothing matched those words. The standing readings below are matched
       properly and may get closer than a search can.</p>`;
  announce(`${top.length} passages found`);
}

async function openTheme(slug){
  const out = document.getElementById("findout");
  out.innerHTML = `<p class="finding">Opening&hellip;</p>`;
  let t;
  try { t = await (await fetch(`themes/${slug}.json`)).json(); }
  catch { out.innerHTML = `<p class="finding">Could not open that reading.</p>`; return; }
  const block = (m, label) => (!m || m.abstained) ? "" : `
    <div class="passage">
      <div class="plabel"><span class="dot"></span>${esc(label)}</div>
      <h3 class="scripture">${esc(m.heading || "")}</h3>
      <span class="ref">${esc((m.reference||"").toUpperCase())} · ${esc(T.translation)}</span>
      <div class="ptext open">${esc(m.text || "")}</div>
      ${m.context ? `<div class="ctx"><b>What is happening here:</b> ${esc(m.context)}</div>` : ""}
      ${m.connection ? `<div class="conn">${esc(m.connection)}</div>` : ""}
    </div>`;
  out.innerHTML = `
    <div class="setting" style="margin-bottom:18px">
      <h3>${esc(t.title)} <span class="chip ${esc(t.register)}" style="margin-left:6px">${esc(t.register)}</span></h3>
      <div class="note">${esc(t.situation)}</div>
      <div style="padding:16px;display:flex;flex-direction:column;gap:18px">
        ${block(t.echo, "The Echo · a story like this one")}
        ${block(t.promise, "The Promise")}
        ${block(t.prayer, "A prayer you can say")}
      </div>
      <div style="padding:0 16px 16px">
        <button type="button" class="big" data-find-back>Back to all readings</button>
      </div>
    </div>`;
  window.scrollTo({top:0});
  announce(`${t.title} opened`);
}

/* ---------- interactions ---------- */
document.addEventListener("click", e => {
  const themeCard = e.target.closest("[data-theme]");
  if (themeCard){ openTheme(themeCard.dataset.theme); return; }
  if (e.target.closest("[data-find-back]")){
    document.getElementById("pane-find").innerHTML = findHome();
    window.scrollTo({top:0});
    return;
  }
  if (e.target.closest("[data-dosearch]")){
    const q = document.getElementById("q").value;
    loadSearch().then(() => runSearch(q));
    return;
  }
  const remindOn = e.target.closest("[data-remind-on]");
  if (remindOn){
    const time = document.getElementById("remind-time").value || "07:00";
    const note = document.getElementById("remind-note");
    if (!("Notification" in window)){
      note.textContent = "This browser cannot show notifications. Set one in your phone's clock app instead.";
      return;
    }
    Notification.requestPermission().then(result => {
      if (result === "granted"){
        try { localStorage.setItem(REMIND_KEY, JSON.stringify({on: true, time})); } catch {}
        remindOn.textContent = "Reminder set for " + time;
        scheduleReminder();
        announce("Reminder set for " + time);
      } else {
        note.textContent = "Notifications were declined, so no reminder is set. You can set one in your phone's clock app for the same time.";
      }
    });
    return;
  }
  const canonPick = e.target.closest("[data-canon]");
  if (canonPick){
    document.querySelectorAll("[data-canon]").forEach(b => b.setAttribute("aria-checked","false"));
    canonPick.setAttribute("aria-checked","true");
    try { localStorage.setItem(CANON_KEY, canonPick.dataset.canon); } catch {}
    announce(canonPick.querySelector(".nm").textContent + " selected");
    return;
  }
  if (e.target.closest("[data-canon-done]")){
    try { if (!localStorage.getItem(CANON_KEY)) localStorage.setItem(CANON_KEY,"protestant"); } catch {}
    document.getElementById("firstrun").hidden = true;
    document.getElementById("main").focus();
    return;
  }
  const shareBtn = e.target.closest("[data-share]");
  if (shareBtn){ openShare(shareBtn.dataset.share); return; }
  if (e.target.closest("[data-share-close]")){
    document.getElementById("sheet").hidden = true;
    document.body.style.overflow = "";
    return;
  }
  if (e.target.closest("[data-share-copy]")){
    const m = passageFor(document.getElementById("sheet").dataset.ref);
    if (m && navigator.clipboard){
      navigator.clipboard.writeText(shareText(m)).then(
        () => announce("Passage copied"),
        () => announce("Could not copy"));
    }
    return;
  }
  if (e.target.closest("[data-share-save]")){
    const c = document.getElementById("sheet-canvas");
    const hint = document.getElementById("sheet-hint");
    try {
      const a = document.createElement("a");
      a.download = "lamplight-" + T.date + ".png";
      a.href = c.toDataURL("image/png");
      a.click();
      hint.textContent = "If nothing downloaded, press and hold the image above to save it — some browsers block downloads from embedded pages.";
    } catch {
      hint.textContent = "Press and hold the image above to save it.";
    }
    return;
  }
  const medOpen = e.target.closest("[data-meditate]");
  if (medOpen){ mvOpen(medOpen.dataset.meditate); return; }
  if (e.target.closest("[data-med-close]")){ mvClose(); return; }
  if (e.target.closest("[data-med-toggle]")){ mvRun(!med.running); return; }
  if (e.target.closest("[data-med-next]")){
    if (med.i < MED.movements.length-1) mvStart(med.i+1); else mvClose();
    return;
  }
  const quiet = e.target.closest("[data-quiet]");
  if (quiet){
    const on = document.body.classList.toggle("quiet");
    quiet.setAttribute("aria-pressed", String(on));
    quiet.textContent = on ? "Show the news" : "Skip the news today";
    try { localStorage.setItem("lamplight.quiet", on ? "1" : "0"); } catch {}
    return;
  }
  const noteBtn = e.target.closest("[data-note]");
  if (noteBtn){
    const wrap = noteBtn.closest(".passage").querySelector(".notewrap");
    wrap.hidden = !wrap.hidden;
    if (!wrap.hidden){
      const box = wrap.querySelector(".notebox");
      try { box.value = localStorage.getItem("lamplight.note." + noteBtn.dataset.note) || ""; } catch {}
      box.focus();
    }
    return;
  }
  const wrong = e.target.closest("[data-wrong]");
  if (wrong){
    const on = wrong.getAttribute("aria-pressed") !== "true";
    wrong.setAttribute("aria-pressed", String(on));
    wrong.textContent = on ? "Reported — thank you" : "This reading was wrong";
    try {
      const log = JSON.parse(localStorage.getItem("lamplight.wrong") || "[]");
      if (on) log.push({date:T.date, ref:wrong.dataset.wrong, at:new Date().toISOString()});
      localStorage.setItem("lamplight.wrong", JSON.stringify(log));
    } catch {}
    return;
  }
  const themeSetBtn = e.target.closest("[data-theme-set]");
  if (themeSetBtn){ applyTheme(themeSetBtn.dataset.themeSet); return; }
  const goto = e.target.closest("[data-goto]");
  if (goto){ showPane(goto.dataset.goto); return; }
  const themeBtn = e.target.closest(".theme-btn");
  if (themeBtn){
    const card = themeBtn.closest(".theme");
    const body = document.getElementById(themeBtn.getAttribute("aria-controls"));
    const open = card.getAttribute("data-open") === "true";
    card.setAttribute("data-open", open?"false":"true");
    themeBtn.setAttribute("aria-expanded", open?"false":"true");
    body.hidden = open;
    return;
  }
  const expand = e.target.closest("[data-expand]");
  if (expand){
    const box = expand.closest(".passage").querySelector("[data-text]");
    box.classList.toggle("open");
    expand.textContent = box.classList.contains("open") ? "Show less" : "Read in full";
    return;
  }
  const checks = e.target.closest("[data-checks]");
  if (checks){
    checks.closest(".passage").querySelector(".checks").classList.toggle("open");
    return;
  }
  const opt = e.target.closest(".opt");
  if (opt){
    opt.parentElement.querySelectorAll(".opt").forEach(o=>o.setAttribute("aria-checked","false"));
    opt.setAttribute("aria-checked","true");
    return;
  }
  const approve = e.target.closest("[data-approve]");
  if (approve){
    approve.textContent = "Approved";
    approve.disabled = true;
    return;
  }
  const tab = e.target.closest(".tab");
  if (tab){ showPane(tab.dataset.pane); }
});

document.addEventListener("input", e => {
  const box = e.target.closest(".notebox");
  if (!box) return;
  const ref = box.closest(".passage").querySelector("[data-note]").dataset.note;
  try {
    localStorage.setItem("lamplight.note." + ref, box.value);
    const flag = box.parentElement.querySelector(".saved-note");
    flag.hidden = !box.value.trim();
  } catch {}
});

document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target && e.target.id === "q"){
    e.preventDefault();
    loadSearch().then(() => runSearch(e.target.value));
    return;
  }
  if (e.key === "Escape" && !player.hidden){ mvClose(); return; }
  const sheet = document.getElementById("sheet");
  if (e.key === "Escape" && sheet && !sheet.hidden){
    sheet.hidden = true; document.body.style.overflow = "";
  }
});
</script>
